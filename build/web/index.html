<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Если вы хостите приложение не в корне, поменяйте значение base href -->
    <base href="/">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="nomix">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

    <!-- Принудительная очистка старого Service Worker -->
    <script defer>
        if (window.TelegramWebApp && 'serviceWorker' in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(regs => {
              regs.forEach(reg => reg.unregister());
            })
            .catch(err => console.error('SW unregister failed:', err));
        }
    </script>

    <title>nomix</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- Flutter bootstrap -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
